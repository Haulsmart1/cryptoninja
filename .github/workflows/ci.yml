name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://crypto-ci.example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:auth
      - run: npm run test:status
      - run: npx tsc --noEmit
      - run: npm run build

  trading-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trading-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/trading-engine/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall .
      - run: python -m unittest discover -s tests
